<!DOCTYPE html>
<html>
<head>
    <title>Icon Template Square</title>
    <style>
        .row{
            width:720px;
            margin: 10px auto 10px auto ;
        }
        .image-container {
            display: table-cell;
            vertical-align: middle;
            padding:20px;
        }

        .hover-wrap{
            position:relative;
            width:250px;
            height:250px;
            cursor:pointer;
            display:block;
        }
        .hover-wrap img{
            position:absolute;
            top:0;
            left:0;
            width:250px;
            height:250px;
            transition: opacity 0.25s ease;
        }
        .hover-img{
            opacity:0;
            pointer-events:none;
        }
        .hover-wrap:hover .hover-img{
            opacity:1;
        }
        .hover-wrap:hover .normal-img{
            opacity:0;
        }
    </style>
</head>
<body>

<div class="row">
    <div class="image-container">
        <div class="hover-wrap" data-sound="s1">
            <img class="normal-img" src="img/icon1.png"/>
            <img class="hover-img" src="img/icon10.png"/>
        </div>
    </div>
    <div class="image-container">
        <div class="hover-wrap" data-sound="s2">
            <img class="normal-img" src="img/icon2.png"/>
            <img class="hover-img" src="img/icon11.png"/>
        </div>
    </div>
    <div class="image-container">
        <div class="hover-wrap" data-sound="s3">
            <img class="normal-img" src="img/icon3.png"/>
            <img class="hover-img" src="img/icon12.png"/>
        </div>
    </div>
</div>

<div class="row">
    <div class="image-container">
        <div class="hover-wrap" data-sound="s4">
            <img class="normal-img" src="img/icon4.png"/>
            <img class="hover-img" src="img/icon13.png"/>
        </div>
    </div>
    <div class="image-container">
        <div class="hover-wrap" data-sound="s5">
            <img class="normal-img" src="img/icon5.png"/>
            <img class="hover-img" src="img/icon14.png"/>
        </div>
    </div>
    <div class="image-container">
        <div class="hover-wrap" data-sound="s6">
            <img class="normal-img" src="img/icon6.png"/>
            <img class="hover-img" src="img/icon15.png"/>
        </div>
    </div>
</div>

<div class="row">
    <div class="image-container">

    <div class="image-container">

        </div>
    </div>
    <div class="image-container">
        <div class="hover-wrap" data-sound="s9">
            <img class="normal-img" src="img/icon9.png"/>

        </div>
    </div>
</div>
